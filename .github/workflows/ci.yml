name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  # Compiles the real firmware for the real targets. sketch.yaml pins the core,
  # its toolchain and the library, so this builds identically here and locally.
  firmware:
    name: Firmware (${{ matrix.board.slug }}, ${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # pico-bidir-dshot supports both RP2350 cores, so build both. The
        # RISC-V build catches anything that quietly assumes Cortex-M.
        arch: [arm, riscv]
        # Both supported boards. They share an FQBN and differ only in a
        # compile-time constant, which is exactly why building just one would
        # look green while the other never compiles.
        board:
          - { slug: touch-lcd-2,   id: BOARD_RP2350_TOUCH_LCD_2,   profile: rp2350 }
          - { slug: touch-lcd-2.8, id: BOARD_RP2350_TOUCH_LCD_2_8, profile: rp2350_28 }
    steps:
      - uses: actions/checkout@v4

      - name: Install arduino-cli
        uses: arduino/setup-arduino-cli@v2

      - name: Cache the core and toolchain
        uses: actions/cache@v4
        with:
          # ~1 GB of core plus GCC; without this every run re-downloads it.
          path: |
            ~/.arduino15
            ~/Arduino
          key: arduino-${{ matrix.arch }}-${{ hashFiles('sketch.yaml') }}

      # An arduino-cli profile cannot carry a -D, so the board is a literal in
      # src/board.h. select_board.sh rewrites it and reads it back, so a sed
      # that stops matching fails the job instead of silently building the
      # default board twice under two different names.
      - name: Select the board
        run: bash test/select_board.sh ${{ matrix.board.id }}

      # Prints flash and RAM usage, which is worth watching: the framebuffer
      # alone is 150 KB of the RP2350's 520 KB.
      - name: Compile
        run: |
          sed -i 's/arch=arm/arch=${{ matrix.arch }}/' sketch.yaml
          arduino-cli compile --profile ${{ matrix.board.profile }} \
            --warnings all --output-dir build

      # Run the same validator the release uses, on every push. Releases are
      # rare, so a check that only runs at release time is a check that rots
      # unnoticed between them -- which is exactly how it shipped broken.
      - name: Validate the image
        run: |
          bash test/check_uf2_selftest.sh
          for f in build/*.uf2; do bash test/check_uf2.sh "$f"; done

      # Every green build produces a flashable image, so a change can be tried
      # on hardware without cutting a release first.
      - name: Upload firmware image
        uses: actions/upload-artifact@v4
        with:
          name: DshotDisplay-${{ matrix.board.slug }}-${{ matrix.arch }}-uf2
          path: build/*.uf2
          if-no-files-found: error

  # Runs the firmware's own logic on the host, against stubs. Catches the
  # protocol, codec and UI regressions that a compile alone cannot.
  tests:
    name: Host tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # `make both` runs the suite once per board. Only the pin map and the
      # splash board name differ, but the splash is length-checked and the 2.8"
      # name is the longer one.
      - name: Build and run
        working-directory: test
        run: make both
      - name: Upload rendered frames on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failed-frames
          path: test/*.ppm

  # Every build-time option, on every board, with warnings fatal. These
  # permutations are easy to break precisely because nobody compiles them by
  # hand -- and the touch drivers are compiled *only* here, since the host
  # tests link fakes in their place.
  variants:
    name: Config permutations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # LCD_ROTATION is 0 or 2 only: the screen layout is portrait-only and a
      # static_assert in ui.cpp says so. Landscape is excluded here because it
      # is meant to fail, not because it is untested.
      #
      # -include test/stubs/core_defines.h reproduces the -D flags arduino-pico
      # puts on every real compile line. With -Werror, a project macro that
      # collides with one of the core's is an error here rather than a warning
      # that only appears on someone's IDE console.
      - name: Build each combination with -Werror
        run: |
          set -e
          fail=0
          for board in BOARD_RP2350_TOUCH_LCD_2 BOARD_RP2350_TOUCH_LCD_2_8; do
            for tx in 0 1; do
              for jump in 0 1; do
                for rot in 0 2; do
                  work=$(mktemp -d)
                  cp -r src "$work/src"
                  cp DshotDisplay.ino "$work/main.cpp"
                  sed -i '1i void setup(); void loop(); void setup1(); void loop1();' "$work/main.cpp"
                  bash test/select_board.sh "$board" "$work/src/board.h" >/dev/null
                  sed -i "s/#define AM32_PUSH_PULL_TX      1/#define AM32_PUSH_PULL_TX      $tx/" "$work/src/config.h"
                  sed -i "s/#define AM32_FORCE_LOW_JUMP    0/#define AM32_FORCE_LOW_JUMP    $jump/" "$work/src/config.h"
                  sed -i "s/#define LCD_ROTATION           0/#define LCD_ROTATION           $rot/" "$work/src/config.h"
                  printf '%-30s TX=%s JUMP=%s ROT=%s ... ' "$board" "$tx" "$jump" "$rot"
                  if g++ -std=gnu++17 -fsyntax-only -Wall -Wextra -Wshadow -Werror \
                         -Wno-unused-parameter -Itest/stubs -I"$work" \
                         -include test/stubs/core_defines.h \
                         "$work/main.cpp" "$work"/src/*.cpp; then
                    echo ok
                  else
                    echo FAIL; fail=1
                  fi
                done
              done
            done
          done

          # And confirm the portrait guard actually refuses landscape, rather
          # than the assert being decorative.
          work=$(mktemp -d)
          cp -r src "$work/src"; cp DshotDisplay.ino "$work/main.cpp"
          sed -i '1i void setup(); void loop(); void setup1(); void loop1();' "$work/main.cpp"
          sed -i "s/#define LCD_ROTATION           0/#define LCD_ROTATION           1/" "$work/src/config.h"
          if g++ -std=gnu++17 -fsyntax-only -Itest/stubs -I"$work" \
                 "$work/main.cpp" "$work"/src/*.cpp 2>/dev/null; then
            echo "landscape guard did NOT fire"; fail=1
          else
            echo "landscape correctly rejected ... ok"
          fi

          # Same for an unrecognised board id. The failure this prevents is a
          # typo in BOARD falling through to whichever pin map happens to be
          # listed last, which would compile and then drive the wrong pins.
          work=$(mktemp -d)
          cp -r src "$work/src"
          sed -i 's|^#define BOARD .*|#define BOARD 999|' "$work/src/board.h"
          echo '#include "board_pins.h"' > "$work/probe.cpp"
          if g++ -std=gnu++17 -fsyntax-only -Itest/stubs -I"$work/src" \
                 "$work/probe.cpp" 2>/dev/null; then
            echo "unknown-board guard did NOT fire"; fail=1
          else
            echo "unknown board correctly rejected ... ok"
          fi

          exit $fail

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Precise check: public API documented, @param names matching their
      # signatures, no dangling @ref. Narrower than Doxygen's blunt
      # WARN_IF_UNDOCUMENTED, and correspondingly worth failing on.
      - name: Documentation checks
        run: python3 test/check_docs.py

      - name: Install doxygen
        run: sudo apt-get update && sudo apt-get install -y doxygen graphviz

      # Any warning left here is structural -- a broken @ref target, a second
      # @mainpage, a missing image -- not a style opinion.
      - name: Generate
        run: |
          set -o pipefail
          doxygen 2>doxygen.log || { echo "doxygen exited non-zero"; cat doxygen.log; exit 1; }
          count=$(grep -ci 'warning' doxygen.log || true)
          if [ "${count:-0}" -gt 0 ]; then
            echo "::error::Doxygen reported $count warning(s)"
            head -40 doxygen.log
            exit 1
          fi
          echo "no doxygen warnings"

      - uses: actions/upload-artifact@v4
        with:
          name: api-docs
          path: docs/html
