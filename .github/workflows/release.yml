name: Release

# Cut a release by pushing a tag:
#
#   git tag -a v1.0.0 -m "First release"
#   git push origin v1.0.0
#
# Builds flashable .uf2 images for both supported boards, checksums them, and
# publishes a GitHub Release with the images attached.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and release"
        required: true

env:
  PICO_SDK_VERSION: "2.1.1"

jobs:
  # Resolve the version once so both jobs agree, and so the tag never reaches a
  # shell through ${{ }} interpolation -- a tag containing shell metacharacters
  # would otherwise be executed.
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
    steps:
      - id: pick
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_TAG: ${{ github.ref_name }}
        run: |
          tag="${INPUT_TAG:-$REF_TAG}"
          case "$tag" in
            v*) ;;
            *) echo "::error::'$tag' is not a v-prefixed tag"; exit 1 ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "building $tag"

  build:
    name: Build ${{ matrix.board.slug }}
    needs: version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true   # never publish a half-complete set of assets
      matrix:
        # touch / other_touch / label drive the board-identity assertion below,
        # exactly as in ci.yml. other_touch is empty for the unified image: it
        # deliberately compiles both drivers in.
        board:
          - { slug: "touch-lcd-2",   id: BOARD_RP2350_TOUCH_LCD_2,
              touch: cst816, other_touch: cst328, label: "RP2350-TOUCH-LCD-2" }
          - { slug: "touch-lcd-2.8", id: BOARD_RP2350_TOUCH_LCD_2_8,
              touch: cst328, other_touch: cst816, label: "RP2350-TOUCH-LCD-2.8" }
          - { slug: "unified",       id: BOARD_UNIFIED,
              touch: cst816, other_touch: "", label: "RP2350-TOUCH-LCD-2" }
    steps:
      # ref: is load-bearing for workflow_dispatch. Without it a manual run
      # checks out the branch it was launched from and attaches binaries built
      # from that to a release named after an older tag -- and --verify-tag does
      # not catch it, because the tag does exist. It is the build that is wrong.
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.version.outputs.tag }}

      - name: Install the ARM toolchain
        uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: "13.3.Rel1"

      - name: Install ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      # Same key scheme as ci.yml: not keyed on the board (neither cached path
      # depends on it), with restore-keys so a CMakeLists.txt edit reuses the
      # previous entry -- and so release builds share cache entries with CI
      # instead of re-cloning the ~200 MB SDK.
      - uses: actions/cache@v4
        with:
          path: |
            ~/pico-sdk
            build/_deps
          key: picosdk-${{ env.PICO_SDK_VERSION }}-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            picosdk-${{ env.PICO_SDK_VERSION }}-

      - name: Fetch the Pico SDK
        run: |
          if [ ! -d ~/pico-sdk/.git ]; then
            git clone --depth 1 --branch "$PICO_SDK_VERSION" \
              https://github.com/raspberrypi/pico-sdk.git ~/pico-sdk
            git -C ~/pico-sdk submodule update --init --depth 1 lib/tinyusb
          fi

      # Refuse to build a release from unverified code. The tests are cheap and
      # a broken image carrying a version number is worse than no release.
      - name: Host tests
        working-directory: test
        run: make both

      - name: Documentation checks
        run: python3 test/check_docs.py

      - name: Compile
        run: |
          # Set here rather than in env:, because GitHub does not expand ~ in
          # env values -- CMake would receive the literal string "~/pico-sdk"
          # and report the SDK missing.
          export PICO_SDK_PATH="$HOME/pico-sdk"
          # Mirror the CI build exactly: CMAKE_BUILD_TYPE=Release makes the
          # intent explicit (and keeps DWARF present via the SDK's
          # PICO_DEBUG_INFO_IN_RELEASE, which the identity assert below needs),
          # and STRICT=ON applies the same -Werror CI proved the sources clean
          # under -- released bits should be built the way CI tested them.
          cmake -B build -G Ninja -DPICO_BOARD=pico2 -DPICO_PLATFORM=rp2350-arm-s \
                -DCMAKE_BUILD_TYPE=Release \
                -DBOARD=${{ matrix.board.id }} -DSTRICT=ON .
          # Named target rather than a bare `ninja`. sdtest is a bench
          # diagnostic and is deliberately not part of a release: an unlabelled
          # second .uf2 beside the firmware is an invitation to flash the wrong
          # one, and it does nothing a user of the tester wants.
          ninja -C build DshotDisplay
          arm-none-eabi-size "build/DshotDisplay-${{ matrix.board.slug }}.elf"

      # Same assertion CI runs: a UF2 structure check cannot tell the boards
      # apart, and a release that ships the 2.0" image under the 2.8" name is
      # exactly the mistake this exists to catch. The DWARF line table is the
      # discriminator -- both touch drivers export identical symbols, so nm
      # cannot tell the two images apart; the source file each was compiled
      # from is the thing that differs.
      - name: Assert the image is actually for this board
        run: |
          set -e
          elf=build/DshotDisplay-${{ matrix.board.slug }}.elf
          want='${{ matrix.board.touch }}.cpp'
          other='${{ matrix.board.other_touch }}.cpp'

          files=$(arm-none-eabi-objdump --dwarf=rawline "$elf" \
                    | grep -oE 'cst(816|328)\.cpp' | sort -u || true)
          if ! printf '%s\n' "$files" | grep -qx "$want"; then
            echo "::error::$want was not compiled into this image (found: $files)"
            exit 1
          fi
          if [ -n "$other" ] && printf '%s\n' "$files" | grep -qx "$other"; then
            echo "::error::$other is in this image too"
            exit 1
          fi
          # The unified image is the one that must contain *both*, and both
          # board labels with it -- that is the whole claim it makes.
          if [ "${{ matrix.board.slug }}" = "unified" ]; then
            for f in cst816.cpp cst328.cpp; do
              printf '%s\n' "$files" | grep -qx "$f" || {
                echo "::error::unified image is missing $f"; exit 1; }
            done
            for l in RP2350-TOUCH-LCD-2 RP2350-TOUCH-LCD-2.8; do
              strings "$elf" | grep -qx "$l" || {
                echo "::error::unified image is missing the $l label"; exit 1; }
            done
            echo "unified: both drivers and both labels present"
          fi

          # Exact match. "RP2350-TOUCH-LCD-2" is a prefix of the 2.8" label, so
          # a substring test passes on the wrong image.
          if ! strings "$elf" | grep -qx '${{ matrix.board.label }}'; then
            echo "::error::splash label ${{ matrix.board.label }} missing"
            exit 1
          fi
          echo "compiled $want; splash says ${{ matrix.board.label }}"

      # Prove the validator works before trusting its verdict. The first version
      # of this check was inlined here, never executed, and rejected every
      # valid UF2 -- it wanted magic 55463200 instead of 5546320a.
      - name: Self-test the UF2 validator
        run: bash test/check_uf2_selftest.sh

      - name: Name and validate the images
        env:
          TAG: ${{ needs.version.outputs.tag }}
          SLUG: ${{ matrix.board.slug }}
        run: |
          mkdir -p dist
          out="dist/DshotDisplay-${TAG}-${SLUG}.uf2"
          cp "build/DshotDisplay-${SLUG}.uf2" "$out"
          bash test/check_uf2.sh "$out"

      - uses: actions/upload-artifact@v7
        with:
          name: uf2-${{ matrix.board.slug }}
          path: dist/*.uf2
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [version, build]
    runs-on: ubuntu-latest
    # Scoped to the job that needs it. Workflow-scoped, this token was also
    # handed to the build matrix, which runs third-party actions and clones over
    # the network.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.version.outputs.tag }}
          fetch-depth: 0   # generated notes need the history

      - uses: actions/download-artifact@v7
        with:
          pattern: uf2-*
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: |
          ls -l
          sha256sum ./*.uf2 > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Write release notes
        run: |
          cat > notes.md <<'EOF'
          ## Which image

          | File | Use it when |
          |---|---|
          | `DshotDisplay-VERSION-unified.uf2` | **Start here.** Runs on either board; the first boot detects which one it is on (a safe probe of the board's always-on I2C devices) and shows the answer under **CFG → SETUP** to confirm with a save |
          | `DshotDisplay-VERSION-touch-lcd-2.uf2` | The 2.0" board only. A few kB smaller, and never asks |
          | `DshotDisplay-VERSION-touch-lcd-2.8.uf2` | The 2.8" board only |

          The unified image costs about 3 kB of flash over a single-board one,
          against 4 MB available. Take it unless you have a reason not to: the
          single-board images are indistinguishable once flashed, and the 2.8"
          one asserts a power latch the 2.0" does not.

          ## Flashing

          1. Hold **BOOT**, tap **RESET**, release **BOOT**. The board appears as a
             USB drive.
          2. Copy the `.uf2` onto it. The board reboots into the new firmware.

          ## Wiring

          | ESC | 2.0" board | 2.8" board |
          |---|---|---|
          | Signal | **GP4** — P2 header, pin 11 | **GP29** — J4 pin 12 |
          | Ground | **GND** — P2 header, pin 13 | **GND** — J4 pin 1 or 5 |

          The 2.8" brings out only GP28 and GP29. Either works — change it on the
          board itself from **CFG → SETUP**, which remembers the choice across
          power cycles. An ESC on the wrong pin used to be silent with no error
          anywhere; the SETUP screen now shows the live packet rate beside the
          pin selector, so you can see it come off zero.

          Cut or depin the middle wire of the ESC lead: it is the BEC +5 V output,
          and RP2350 GPIO is not 5 V tolerant.

          ## Optional: KISS telemetry

          A third wire from the ESC's telemetry pad gives 0.01 V and 0.01 A
          instead of Extended DShot Telemetry's 0.25 V and 1 A. On the 2.0" board
          it lands on **GP5**, P1 header pin 10. The 2.8" has no free pin for it.

          ## Verify the download

          ```
          sha256sum -c SHA256SUMS.txt
          ```

          ---
          EOF

      # --notes prepends to the generated notes; --notes-file does not combine
      # with --generate-notes, so the body is passed inline.
      # --verify-tag refuses to invent a tag that was never pushed.
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          gh release create "$TAG" \
            --title "$TAG" \
            --notes "$(cat notes.md)" \
            --generate-notes \
            --verify-tag \
            dist/*.uf2 dist/SHA256SUMS.txt

      - name: Confirm the assets landed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          # Creating a release and attaching assets are separate API calls, so
          # a partially-populated release is a real outcome worth catching.
          assets=$(gh release view "$TAG" --json assets --jq '.assets[].name')
          echo "$assets"
          # Full names, fixed-string match. While sdtest also shipped, a bare
          # "touch-lcd-2.uf2" was satisfied by sdtest-...-touch-lcd-2.uf2, so
          # the guard would have passed a release with no firmware in it.
          for want in "DshotDisplay-${TAG}-touch-lcd-2.uf2" \
                      "DshotDisplay-${TAG}-touch-lcd-2.8.uf2" \
                      "DshotDisplay-${TAG}-unified.uf2" \
                      "SHA256SUMS.txt"; do
            echo "$assets" | grep -qxF "$want" || {
              echo "::error::no asset named '$want' on $TAG"; exit 1; }
          done

          # And nothing unexpected: sdtest is deliberately not released, so a
          # stray diagnostic image beside the firmware should fail the run
          # rather than quietly invite someone to flash it.
          unexpected=$(echo "$assets" | grep -v '^DshotDisplay-' | grep -v '^SHA256SUMS.txt$' || true)
          if [ -n "$unexpected" ]; then
            echo "::error::unexpected assets on $TAG: $unexpected"; exit 1
          fi
          echo "all expected assets present, and only those"

  # The user manual lives in wiki/ in this repository and is mirrored to the
  # GitHub wiki from here, on release, so that what the wiki describes is a
  # firmware you can actually download rather than whatever main happened to
  # contain that afternoon.
  #
  # The screenshots are not committed. They are re-rendered here from the host
  # test suite, which draws them with the real UI code -- the same guarantee the
  # README's previews carry, extended to the manual. A page referencing a screen
  # nobody captured fails the link check below rather than publishing a broken
  # image.
  wiki:
    name: Publish wiki
    needs: [version, publish]
    runs-on: ubuntu-latest
    # The wiki is a second git repository behind the same slug, and pushing to
    # it is a contents write. Scoped to this job for the same reason the publish
    # job scopes its token.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.version.outputs.tag }}

      - name: Render the screens from the host suite
        run: |
          make -C test run
          python3 tools/make_previews.py --wiki

      # Cheap, and it catches the two failures that are invisible until someone
      # is reading the published page: a link to a page that was renamed, and an
      # image that no test captures any more.
      - name: Check every internal link and image resolves
        run: python3 tools/check_wiki.py

      - name: Push to the wiki
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          set -eu

          # A wiki that has never had a page created has no .wiki.git to clone,
          # and the clone fails with a bare "repository not found" that reads
          # like a permissions problem. Say what it actually is.
          if ! git clone --depth 1 \
                 "https://x-access-token:${GITHUB_TOKEN}@github.com/${REPO}.wiki.git" wiki-repo 2>clone.log; then
            cat clone.log
            echo "::error::Could not clone ${REPO}.wiki.git. If this is the first \
          run, create one page in the repository's Wiki tab by hand -- GitHub does \
          not create the wiki repository until a page exists."
            exit 1
          fi

          # Mirror rather than merge: wiki/ in the source tree is the only
          # author. Anything edited in the browser is meant to lose, and the
          # footer on every page says so.
          find wiki-repo -mindepth 1 -maxdepth 1 -not -name .git -exec rm -rf {} +
          cp -r wiki/. wiki-repo/

          cd wiki-repo
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "wiki already matches ${TAG}; nothing to push"
            exit 0
          fi
          git commit -m "docs: publish the manual for ${TAG}"
          git push
          echo "wiki updated for ${TAG}"
