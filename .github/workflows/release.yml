name: Release

# Cut a release by pushing a tag:
#
#   git tag -a v1.0.0 -m "First release"
#   git push origin v1.0.0
#
# Builds flashable .uf2 images for both supported boards on both RP2350 cores,
# checksums them, and publishes a GitHub Release with the images attached.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and release"
        required: true

permissions:
  contents: write   # required to create the release and upload assets

jobs:
  # Resolve the version once so both jobs agree, and so the tag never reaches a
  # shell through ${{ }} interpolation -- a tag containing shell metacharacters
  # would otherwise be executed.
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
    steps:
      - id: pick
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_TAG: ${{ github.ref_name }}
        run: |
          tag="${INPUT_TAG:-$REF_TAG}"
          case "$tag" in
            v*) ;;
            *) echo "::error::'$tag' is not a v-prefixed tag"; exit 1 ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "building $tag"

  build:
    name: Build ${{ matrix.board.slug }} ${{ matrix.arch }}
    needs: version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true   # never publish a half-complete set of assets
      matrix:
        arch: [arm, riscv]
        board:
          - { slug: touch-lcd-2,   id: BOARD_RP2350_TOUCH_LCD_2,   profile: rp2350 }
          - { slug: touch-lcd-2.8, id: BOARD_RP2350_TOUCH_LCD_2_8, profile: rp2350_28 }
    steps:
      - uses: actions/checkout@v4

      - uses: arduino/setup-arduino-cli@v2

      - uses: actions/cache@v4
        with:
          path: |
            ~/.arduino15
            ~/Arduino
          key: arduino-${{ matrix.arch }}-${{ hashFiles('sketch.yaml') }}

      # Refuse to build a release from unverified code. The tests are cheap and
      # a broken image carrying a version number is worse than no release.
      # `both` runs them for every board, not just the one being built here.
      - name: Host tests
        working-directory: test
        run: make both

      - name: Documentation checks
        run: python3 test/check_docs.py

      # Reads the edit back, so a release can never ship two identically-built
      # images under two different board names.
      - name: Select the board
        run: bash test/select_board.sh ${{ matrix.board.id }}

      - name: Compile
        run: |
          sed -i 's/arch=arm/arch=${{ matrix.arch }}/' sketch.yaml
          arduino-cli compile --profile ${{ matrix.board.profile }} \
            --warnings all --output-dir build

      # Prove the validator works before trusting its verdict. The first version
      # of this check was inlined here, never executed, and rejected every
      # valid UF2 -- it wanted magic 55463200 instead of 5546320a.
      - name: Self-test the UF2 validator
        run: bash test/check_uf2_selftest.sh

      - name: Name and validate the image
        env:
          TAG: ${{ needs.version.outputs.tag }}
          ARCH: ${{ matrix.arch }}
          BOARD_SLUG: ${{ matrix.board.slug }}
        run: |
          mkdir -p dist
          src=$(ls build/*.uf2 | head -1)
          out="dist/DshotDisplay-${TAG}-${BOARD_SLUG}-${ARCH}.uf2"
          cp "$src" "$out"
          bash test/check_uf2.sh "$out"

      - uses: actions/upload-artifact@v4
        with:
          name: uf2-${{ matrix.board.slug }}-${{ matrix.arch }}
          path: dist/*.uf2
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # generated notes need the history

      - uses: actions/download-artifact@v4
        with:
          pattern: uf2-*
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: |
          ls -l
          sha256sum *.uf2 > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Write release notes
        run: |
          cat > notes.md <<'EOF'
          ## Which image

          Four are attached — pick by board first, then core:

          | Board | File |
          |---|---|
          | Waveshare RP2350-Touch-LCD-2 (2.0") | `...-touch-lcd-2-arm.uf2` |
          | Waveshare RP2350-Touch-LCD-2.8 | `...-touch-lcd-2.8-arm.uf2` |

          Take the **arm** build unless you specifically want the RP2350's RISC-V
          cores; the two are functionally identical.

          The splash screen names the board the image was built for, so a wrong
          guess is visible in the first three seconds rather than as a dead panel.

          ## Flashing

          1. Hold **BOOT**, tap **RESET**, release **BOOT**. The board appears as a
             USB drive.
          2. Copy the `.uf2` onto it. The board reboots into the new firmware.

          ## Wiring

          Two wires, and the pin depends on the board:

          | Board | Signal | Ground |
          |---|---|---|
          | RP2350-Touch-LCD-2 | **GP4** — P2 header, pin 11 | **GND** — P2 header, pin 13 |
          | RP2350-Touch-LCD-2.8 | **GP28** — J4 (JST-SH 12P), pin 11 | **GND** — J4 pin 1 or 5 |

          Cut or depin the middle wire of the ESC lead: it is the BEC +5 V output,
          and RP2350 GPIO is not 5 V tolerant.

          ## Verify the download

          ```
          sha256sum -c SHA256SUMS.txt
          ```

          ---
          EOF

      # --notes prepends to the generated notes; --notes-file does not combine
      # with --generate-notes, so the body is passed inline.
      # --verify-tag refuses to invent a tag that was never pushed.
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          gh release create "$TAG" \
            --title "$TAG" \
            --notes "$(cat notes.md)" \
            --generate-notes \
            --verify-tag \
            dist/*.uf2 dist/SHA256SUMS.txt

      - name: Confirm the assets landed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          # Creating a release and attaching assets are separate API calls, so
          # a partially-populated release is a real outcome worth catching.
          # Every board/arch pair is named explicitly: checking only "arm" and
          # "riscv" would pass with one board's images missing entirely.
          assets=$(gh release view "$TAG" --json assets --jq '.assets[].name')
          echo "$assets"
          for want in touch-lcd-2-arm touch-lcd-2-riscv \
                      touch-lcd-2.8-arm touch-lcd-2.8-riscv SHA256SUMS; do
            echo "$assets" | grep -qF "$want" || {
              echo "::error::no asset matching '$want' on $TAG"; exit 1; }
          done
          echo "all expected assets present"
